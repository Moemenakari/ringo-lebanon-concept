name: Find photos

# Collects real Ringo pack photos (Lebanese retailers, Open Food Facts, solinogroup.com) and real
# ingredient photos (Wikimedia Commons) into assets/source/, so they can be picked and cut out.
on:
  workflow_dispatch: # Actions tab → Find photos → Run workflow
  push:
    branches: [main]
    paths: [scripts/find-photos.mjs, .github/workflows/find-photos.yml]

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/find-photos.mjs
      - name: Park the candidates on a hidden ref (not a branch, never merged)
        run: |
          cd candidates
          git init -q && git checkout -q -b scratch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Ingredient candidates"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/scratch/candidates
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source
          git diff --cached --quiet || (git commit -m "Add source photos" && git pull --rebase && git push)
