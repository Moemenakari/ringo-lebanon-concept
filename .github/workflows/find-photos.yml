name: Find photos

# Collects real Ringo pack photos (Lebanese retailers, Open Food Facts, solinogroup.com) and real
# ingredient photos (Wikimedia Commons) into assets/source/, so they can be picked and cut out.
on:
  workflow_dispatch: # Actions tab → Find photos → Run workflow

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/find-photos.mjs
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source
          git diff --cached --quiet || (git commit -m "Add source photos" && git push)
